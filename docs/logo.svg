<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512"
     role="img" aria-label="bruceLadder: an agarose gel with four lanes of bands">
  <title>bruceLadder</title>
  <defs>
    <linearGradient id="gel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B1A2A"/>
      <stop offset="1" stop-color="#16364F"/>
    </linearGradient>
    <linearGradient id="band" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7DF5DE"/>
      <stop offset="1" stop-color="#31A9F0"/>
    </linearGradient>
    <linearGradient id="marker" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#C3D2E0"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="9" result="blurred"/>
      <feMerge>
        <feMergeNode in="blurred"/>
        <feMergeNode in="blurred"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="512" height="512" rx="96" fill="url(#gel)"/>
  <rect x="8" y="8" width="496" height="496" rx="88" fill="none" stroke="#5EEAD4" stroke-opacity="0.20" stroke-width="2"/>

  <!-- Lanes -->
  <g fill="#FFFFFF" fill-opacity="0.035">
    <rect x="110" y="96" width="64" height="312" rx="18"/>
    <rect x="186" y="96" width="64" height="312" rx="18"/>
    <rect x="262" y="96" width="64" height="312" rx="18"/>
    <rect x="338" y="96" width="64" height="312" rx="18"/>
  </g>

  <!-- Loading wells -->
  <g fill="#06101B" fill-opacity="0.7">
    <rect x="116" y="74" width="52" height="13" rx="5"/>
    <rect x="192" y="74" width="52" height="13" rx="5"/>
    <rect x="268" y="74" width="52" height="13" rx="5"/>
    <rect x="344" y="74" width="52" height="13" rx="5"/>
  </g>

  <g filter="url(#glow)">
    <g fill="url(#marker)">
      <rect x="116" y="117" width="52" height="15" rx="7.5" fill-opacity="0.95"/>
      <rect x="116" y="157" width="52" height="15" rx="7.5" fill-opacity="0.8"/>
      <rect x="116" y="197" width="52" height="15" rx="7.5" fill-opacity="0.92"/>
      <rect x="116" y="241" width="52" height="15" rx="7.5" fill-opacity="0.86"/>
      <rect x="116" y="287" width="52" height="15" rx="7.5" fill-opacity="1.0"/>
      <rect x="116" y="333" width="52" height="15" rx="7.5" fill-opacity="0.78"/>
      <rect x="116" y="379" width="52" height="15" rx="7.5" fill-opacity="0.9"/>
    </g>
    <g fill="url(#band)">
      <rect x="192" y="117" width="52" height="15" rx="7.5" fill-opacity="0.92"/>
      <rect x="192" y="197" width="52" height="15" rx="7.5" fill-opacity="1.0"/>
      <rect x="192" y="241" width="52" height="15" rx="7.5" fill-opacity="0.84"/>
      <rect x="192" y="287" width="52" height="15" rx="7.5" fill-opacity="0.96"/>
      <rect x="192" y="379" width="52" height="15" rx="7.5" fill-opacity="0.88"/>
    </g>
    <g fill="url(#band)">
      <rect x="268" y="117" width="52" height="15" rx="7.5" fill-opacity="0.86"/>
      <rect x="268" y="157" width="52" height="15" rx="7.5" fill-opacity="0.94"/>
      <rect x="268" y="197" width="52" height="15" rx="7.5" fill-opacity="0.78"/>
      <rect x="268" y="241" width="52" height="15" rx="7.5" fill-opacity="1.0"/>
      <rect x="268" y="287" width="52" height="15" rx="7.5" fill-opacity="0.9"/>
      <rect x="268" y="379" width="52" height="15" rx="7.5" fill-opacity="0.96"/>
    </g>
    <g fill="url(#band)">
      <rect x="344" y="117" width="52" height="15" rx="7.5" fill-opacity="1.0"/>
      <rect x="344" y="157" width="52" height="15" rx="7.5" fill-opacity="0.82"/>
      <rect x="344" y="241" width="52" height="15" rx="7.5" fill-opacity="0.9"/>
      <rect x="344" y="287" width="52" height="15" rx="7.5" fill-opacity="0.8"/>
      <rect x="344" y="333" width="52" height="15" rx="7.5" fill-opacity="0.94"/>
      <rect x="344" y="379" width="52" height="15" rx="7.5" fill-opacity="0.86"/>
    </g>
  </g>
</svg>
