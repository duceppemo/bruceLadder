name: Publish to PyPI

# Trusted publishing: PyPI verifies this repository, this workflow file and the pypi environment
# through OIDC, so no API token is stored anywhere. The publisher registered on PyPI names
# duceppemo/brucetyper, publish.yml and the pypi environment, which is why none of the three can
# be renamed without re-registering it.
on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build the sdist and the wheel
        run: |
          python -m pip install --upgrade pip build twine
          python -m build

      - name: Check the metadata
        run: twine check --strict dist/*

      - name: Install the wheel and run the CLI from it
        # A wheel that imports or dispatches wrongly must not reach PyPI
        run: |
          python -m venv /tmp/check
          /tmp/check/bin/pip install --quiet dist/*.whl
          /tmp/check/bin/brucetyper --version
          /tmp/check/bin/brucetyper --help > /dev/null

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/brucetyper
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - uses: pypa/gh-action-pypi-publish@release/v1
